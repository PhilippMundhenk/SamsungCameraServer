# Memory: one Gradle daemon at 2 GB and one Kotlin daemon at 1.5 GB is enough for all modules.
# Both values also apply inside the Docker build (gradle.properties is copied into the image).
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -XX:+UseParallelGC -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx1500m
# Stop idle daemons after 10 minutes instead of 3 hours so they do not pile up between tasks.
org.gradle.daemon.idletimeout=600000
org.gradle.caching=true
org.gradle.configuration-cache=false
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
