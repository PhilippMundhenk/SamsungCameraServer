# Self-hosted cambackup server.
#
#   docker compose up -d
#   open http://<host>:52235/  -> download pairing.zip, unzip into the SD card root
#
# Host networking is the simplest way to let the camera's SSDP discovery (UDP multicast, TTL 2)
# reach the container. On Synology / Proxmox with VLANs use a macvlan network on the camera's
# segment instead (see README).
services:
  cambackup:
    image: ghcr.io/philippmundhenk/cambackup-server:main
    # build: .                      # or build locally from this repository
    container_name: cambackup
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./data:/data                # config, identity (pairing file), ledger (small, back it up)
      - ./photos:/photos            # received files: /photos/<date>/<name> (large)
      # - /volume1/photo/export:/export   # optional: the pipeline moves finished files here (export.dir)
    environment:
      # Every key of data/cambackup.conf can be set here as CAMBACKUP_<KEY>.
      CAMBACKUP_SERVER_NAME: "[PC]Home"
      # CAMBACKUP_SERVER_UDN: 4a682b0b-0361-dbae-6155-xxxxxxxxxxxx   # the UDN shown in the Android app
      # CAMBACKUP_API_TOKEN: change-me                              # must match the app's backend token
      # CAMBACKUP_EXIF_TIMESHIFT: "+1:00"
      # CAMBACKUP_RAW_CONVERT: "true"
      # CAMBACKUP_RENAME_PATTERN: "{yyyy}{MM}{dd}_{HH}{mm}{ss}_{base}.{ext}"
      # CAMBACKUP_EXPORT_DIR: /export
      # CAMBACKUP_WEBHOOK_URL: http://homeassistant.lan:8123/api/webhook/cambackup
