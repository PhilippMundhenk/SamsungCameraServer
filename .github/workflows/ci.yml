name: CI

# Every push / PR: tests with the 95 % coverage gates, debug APK, server distribution, container
# image. On main: image pushed as :main + :latest. On v* tags: image as :1.2.3 / :1.2 / :latest and
# a GitHub release with the APK + server zip attached.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: cambackup-server

jobs:
  test:
    name: JVM tests + coverage gates, APK, server zip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - name: Core + server tests with the 95 % line-coverage gate
        run: ./gradlew :core:check :server:check --no-daemon
      - name: Server distribution
        run: ./gradlew :server:distZip --no-daemon
      - name: Debug APK + instrumented test APK
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon
      - name: Release APK (signed with the release key when the secret exists, otherwise debug-signed)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then echo "$KEYSTORE_B64" | base64 -d > app/release.keystore; fi
          ./gradlew :app:assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release*.apk cambackup-${GITHUB_REF_NAME//\//-}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: cambackup-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: cambackup-release-apk
          path: cambackup-*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: cambackup-server
          path: server/build/distributions/cambackup-server*.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jvm-test-and-coverage-reports
          path: |
            core/build/reports
            server/build/reports

  ui-test:
    name: Android UI end-to-end + 95 % coverage gate (emulator)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Espresso tests with coverage, then the gate
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot-save
          # dismiss the keyguard / any "System UI isn't responding" dialog: Espresso otherwise
          # fails with RootViewWithoutFocusException before the first test runs
          script: |
            # the runner reports "booted" a little before adb is really usable ("device offline"):
            # wait for a healthy device ourselves before touching it
            adb kill-server || true; adb start-server
            adb wait-for-device
            for i in $(seq 1 60); do
              state=$(adb get-state 2>/dev/null || true)
              booted=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)
              [ "$state" = "device" ] && [ "$booted" = "1" ] && break
              sleep 2
            done
            # no keyevent 82 (MENU) here: on the launcher it opens the "Wallpaper & style" popup,
            # which then holds window focus and fails every Espresso test
            adb shell wm dismiss-keyguard || true
            adb shell input keyevent 4 || true
            adb shell input keyevent 3 || true
            adb shell settings put global hidden_api_policy 1 || true
            adb logcat -c || true
            mkdir -p app/build/emulator-diagnostics
            adb exec-out screencap -p > app/build/emulator-diagnostics/before.png || true
            set +e
            # an emulator that loses window focus (RootViewWithoutFocusException on the first test)
            # is an environment failure, not a test failure: one retry after re-settling the device
            rc=1
            for attempt in 1 2; do
              ./gradlew :app:connectedDebugAndroidTest :app:jacocoAndroidTestReport :app:jacocoAndroidTestCoverageVerification --no-daemon
              rc=$?
              [ $rc -eq 0 ] && break
              if [ $attempt -eq 1 ] && grep -rq "RootViewWithoutFocusException" app/build/outputs/androidTest-results 2>/dev/null; then
                echo "::warning::window focus lost on the emulator, retrying the suite once"
                adb exec-out screencap -p > app/build/emulator-diagnostics/after-attempt1.png || true
                adb shell wm dismiss-keyguard || true; adb shell input keyevent 4 || true; adb shell input keyevent 3 || true; sleep 10
              else
                break
              fi
            done
            set -e
            # what was on screen and in focus when the run ended, plus the full logcat
            adb exec-out screencap -p > app/build/emulator-diagnostics/after.png || true
            adb shell dumpsys window | grep -E "mCurrentFocus|mFocusedApp" > app/build/emulator-diagnostics/focus.txt || true
            adb logcat -d > app/build/emulator-diagnostics/logcat.txt || true
            exit $rc
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-and-coverage-reports
          path: |
            app/build/reports/androidTests/connected
            app/build/reports/jacoco
            app/build/emulator-diagnostics

  image:
    name: Server container image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Smoke test the image (phone API, pipeline, /photos + /export volumes, token, dedup)
        run: |
          pip install --quiet pillow
          tools/container-smoke.sh cambackup-server:ci
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build (and push on main / tags)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: GitHub release (tags)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [test, ui-test, image]
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: cambackup-*
          merge-multiple: true
      - name: Rename the artifacts after the tag
        run: |
          ls -la
          mv app-debug.apk cambackup-${GITHUB_REF_NAME}-debug.apk
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            cambackup-*.apk
            cambackup-server*.zip
          body: |
            Container image: `ghcr.io/${{ github.repository_owner }}/cambackup-server:${{ github.ref_name }}` (also `:latest`).
            Samsung Camera Backup is an independent project, not affiliated with Samsung.
